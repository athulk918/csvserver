[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prom-ai"
version = "0.1.0"
description = "Adaptive Prometheus/Azure Monitor alert calibration from historical metrics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Prometheus Whisperer"}]
dependencies = []

[project.scripts]
prom-ai = "prom_ai.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
